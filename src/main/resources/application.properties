# =============================================
# Application Configuration
# =============================================
spring.application.name=book_keeping
server.port=8080

# =============================================
# Supabase PostgreSQL Datasource (Schema: app)
# =============================================
# Configured with Supabase IPv4 Pooler (eu-west-1, port 5432 session mode).
# Schema: app
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?currentSchema=app&sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres.oglhvyszhokkvjrrcolu}
spring.datasource.password=${SUPABASE_DB_PASSWORD:unai_analytic_db}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# HikariCP Connection Pool (Optimized for Supabase)
# =============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# =============================================
# JPA / Hibernate for PostgreSQL & Schema 'app'
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# =============================================
# SQL Initialization (Applies schema.sql and data.sql into schema 'app')
# =============================================
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
